[project]
name = "sidebyside-https-api"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "pydantic-settings>=2.7,<3",
  "cryptography>=44,<49",
  "uvicorn[standard]>=0.34,<1"
]

[tool.uv]
package = false

[tool.vercel]
entrypoint = "app:app"
