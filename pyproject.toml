[project]
name = "sidebyside-api"
version = "0.1.0"
description = "Authenticated SidebySide onboarding and nearby discovery API"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "pydantic-settings>=2.7,<3",
  "cryptography>=44,<49",
  "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=0.25,<2",
    "ruff>=0.11,<1",
    "jsonschema>=4.23,<5",
    "scikit-learn>=1.6,<2",
    "pip>=25,<27",
]

[project.optional-dependencies]
inference = [
  "torch==2.13.0",
  "transformers==4.57.6",
  "sentence-transformers==5.1.2",
  "numpy>=2.2,<3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["services/api", "."]
testpaths = ["services/api/tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100
include = ["services/api/**/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501", "B008"]
